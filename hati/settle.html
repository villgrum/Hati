<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Hati, settle up</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Bricolage+Grotesque:wght@600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="wrap">
      <a class="brand" href="index.html">Hati</a>
      <a class="top-link" href="index.html">All groups</a>
    </div>
  </header>
  <main class="wrap narrow">
    <div class="group-top">
      <div class="group-title">
        <h1>Baguio trip</h1>
        <span class="role">Holder</span>
      </div>
      <a class="button small" href="bill.html">Add a bill</a>
    </div>
    <p class="role-note">4 people, only you can change anything</p>
    <nav class="tabs" aria-label="Group sections">
      <a href="hangout.html">Overview</a>
      <a href="#">Bills</a>
      <a href="settle.html" aria-current="page">Settle up</a>
      <a href="#">History</a>
    </nav>
    <section class="panel">
      <div class="meter" role="img" aria-label="₱700 of ₱4,900 settled"><span style="--w: 14.3%"></span></div>
      <p class="sub"><strong>₱700</strong> of <strong>₱4,900</strong> settled</p>
    </section>
    <section class="receipt">
      <h2>Who pays whom</h2>
      <ul class="lines">
        <li><span><strong>Dan</strong> pays <strong>Ana</strong></span><b>₱3,100</b><button class="button ghost small" type="button">Mark as paid</button></li>
        <li><span><strong>Carla</strong> pays <strong>Ana</strong></span><b>₱1,100</b><button class="button ghost small" type="button">Mark as paid</button></li>
        <li><span><strong>Ben</strong> pays <strong>Ana</strong></span><b>₱700</b><span class="paid-tag">Paid</span></li>
      </ul>
      <p class="total"><span>Still to be paid</span><b>₱4,200</b></p>
    </section>
  </main>
</body>
</html>
